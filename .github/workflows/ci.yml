name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, smoke test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pip-audit ruff

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Lint and format-check
        run: |
          ruff check .
          ruff format --check .

      - name: Compile and smoke test API
        run: |
          python -m compileall -q main.py app
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          assert app.openapi()["paths"]
          response = TestClient(app).get("/api/v1/issues/")
          assert response.status_code == 200, response.text
          PY

      - name: Audit dependencies
        run: pip-audit
